<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Daily Dispatch</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-top">
      <span class="masthead-date" id="masthead-date">&nbsp;</span>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true">&#9789;</span>
      </button>
      <span class="masthead-est">Est. 2026 &middot; Local Edition</span>
    </div>
    <h1 class="masthead-title">The Daily Dispatch</h1>
    <p class="masthead-tagline">All the News You Choose to View</p>
  </header>

  <nav class="controls">
    <div class="tabs" role="tablist" aria-label="News region">
      <button class="tab active" data-region="india" role="tab" aria-selected="true">India</button>
      <button class="tab" data-region="world" role="tab" aria-selected="false">World</button>
    </div>
    <div class="date-control">
      <label for="date-input">Edition date</label>
      <input type="date" id="date-input" />
      <button id="today-btn" type="button">Today</button>
    </div>
  </nav>

  <div id="note-banner" class="note-banner" hidden></div>

  <main id="content" class="content">
    <div id="skeleton" class="skeleton-grid" hidden>
      <div class="skeleton-hero"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
    <div id="empty-state" class="empty-state" hidden>
      <p>No stories on file for this edition yet.</p>
      <p class="empty-sub">Try choosing a different date.</p>
    </div>
    <section id="featured-row" class="featured-row">
      <div id="secondary-slot"></div>
      <div id="lead-slot"></div>
      <aside id="popular-slot"></aside>
    </section>
    <section id="row2" class="feature-row-2"></section>
    <section id="grid" class="article-grid"></section>
  </main>

  <footer class="site-footer">
    <p>Compiled locally from public news feeds &middot; For personal reading only</p>
  </footer>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <article class="modal-paper" role="dialog" aria-modal="true">
      <button id="modal-close" class="modal-close" aria-label="Close article">&times;</button>
      <div id="modal-body" class="modal-body"></div>
    </article>
  </div>

  <script src="app.js"></script>
</body>
</html>
